name = "novelist-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# D1 Database - SQLite miễn phí 5GB
[[d1_databases]]
binding = "DB"
database_name = "novelist-db"
database_id = "e4b70ce9-bc09-4448-bc05-f7bfa2f7c69c"
migrations_dir = "src/db/migrations"

# R2 Bucket - Tùy chọn (Bật sau khi kích hoạt R2 trên dashboard nếu cần)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "novelist-storage"

# KV Namespace - Cache, session, rate limiting
[[kv_namespaces]]
binding = "KV"
id = "356e7dae6d344dc1ae81e1e9c6bc035c"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "novelist-jwt-secret-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e"
ENCRYPTION_KEY = "novelist-key-32-chars-long-prod!"
FRONTEND_URL = "https://vercel.app"

